[project]
name = "yt-scribe"
version = "0.1.0"
description = "Turn YouTube channels into an Atom feed carrying transcripts"
requires-python = ">=3.11"
# Empty on purpose: the runtime is the standard library. The heavy lifting is
# done by yt-dlp, ffmpeg and whisper-cli, which the user installs themselves.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1.13", "pre-commit>=4"]

[project.scripts]
yt-scribe = "yt_scribe.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yt_scribe"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "ISC",   # implicit str concat
  "N",     # pep8-naming
  "PERF",  # performance anti-patterns
  "PIE",
  "PTH",   # use pathlib
  "RET",
  "RUF",
  "SIM",
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals and monkeypatch them; that is the point.
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["yt_scribe"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true
warn_return_any = true
warn_no_return = true
show_error_context = true
# Only the package is type-checked; the tests are covered by running them.
