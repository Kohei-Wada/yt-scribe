[project]
name = "yt-scribe"
version = "0.1.0"
description = "Turn YouTube channels into an Atom feed carrying transcripts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt-scribe = "yt_scribe.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
